name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Dalamud development references
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath dalamud
          $dll = Get-ChildItem dalamud -Recurse -Filter Dalamud.dll | Select-Object -First 1
          if (-not $dll) { throw 'Dalamud references missing' }
          "DALAMUD_HOME=$($dll.Directory.FullName)\" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test logic
        run: dotnet run --project tests/HotbarTools.Tests -c Release
      - name: Build plugins
        shell: pwsh
        run: |
          dotnet build hotbar-sync/HotbarBridge/HotbarBridge.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build job-setup/JobSetup/JobSetup.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'development' }
          python tools/package_release.py --repository '${{ github.repository }}' --tag $tag
      - uses: actions/upload-artifact@v4
        with:
          name: HotbarTools
          path: artifacts/*
      - name: Publish test release and feed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' artifacts/HotbarBridge.zip artifacts/JobSetup.zip artifacts/pluginmaster.json artifacts/SHA256SUMS.txt --prerelease --title 'Hotbar Tools ${{ github.ref_name }}' --notes 'Initial test builds. See README for installation and limitations.'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item pluginmaster.json $env:RUNNER_TEMP/pluginmaster.json
          git fetch origin main
          git checkout main
          Copy-Item $env:RUNNER_TEMP/pluginmaster.json pluginmaster.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m 'Update Dalamud feed'; git push origin main }
